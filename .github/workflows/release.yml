name: Release Vocab PWA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify PWA release
        run: |
          npm ci
          npm run test:core
          npm run typecheck
          npm run lint
          npm run build:pages
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Vocab for PWA $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
